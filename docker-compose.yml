version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: spa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: spa_db
      POSTGRES_USER: spa_user
      POSTGRES_PASSWORD: spa_local_dev_pw
    ports:
      - "5432:5432"
    volumes:
      - spa_pgdata:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: spa_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - spa_mongodata:/data/db

  mailhog:
    image: mailhog/mailhog
    container_name: spa_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP — point your app's mail sender here in dev
      - "8025:8025" # Web UI to view "sent" emails at localhost:8025

volumes:
  spa_pgdata:
  spa_mongodata:
