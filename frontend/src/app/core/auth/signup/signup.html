<div class="min-h-screen flex bg-gray-50">
  <div
    class="hidden lg:flex lg:w-1/2 bg-gradient-to-br from-indigo-600 to-blue-700 text-white flex-col justify-center px-16"
  >
    <h1 class="text-4xl font-bold mb-4">AI Placement OS</h1>
    <p class="text-indigo-100 text-lg leading-relaxed">
      Personalized roadmaps, ATS scoring, and interview prep — built around your resume.
    </p>
  </div>

  <div class="flex-1 flex items-center justify-center px-6">
    <div class="w-full max-w-sm">
      <h2 class="text-2xl font-semibold text-gray-900 mb-1">Create your account</h2>
      <p class="text-gray-500 text-sm mb-8">Start building your placement plan</p>

      <form (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Full name</label>
          <input
            type="text"
            [(ngModel)]="name"
            name="name"
            placeholder="Jane Doe"
            class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
            required
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="you@example.com"
            class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
            required
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input
            type="password"
            [(ngModel)]="password"
            name="password"
            placeholder="At least 8 characters"
            class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
            required
            minlength="8"
          />
        </div>

        @if (error()) {
          <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-3 py-2">
            {{ error() }}
          </div>
        }

        <button
          type="submit"
          [disabled]="loading()"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed"
        >
          {{ loading() ? 'Creating account…' : 'Sign up' }}
        </button>
      </form>

      <p class="text-sm text-gray-500 mt-6 text-center">
        Have an account?
        <a routerLink="/login" class="text-indigo-600 font-medium hover:underline">Log in</a>
      </p>
    </div>
  </div>
</div>
